<!-- JS selector for site. -->

<!-- Simple Jekyll Search (search.json built by the plugin) -->
<script
  defer
  src="{{ '/assets/lib/simple-jekyll-search/simple-jekyll-search.min.js' | relative_url }}"
></script>

{% if page.layout == 'post' or page.layout == 'page' %}
  <!-- code copy + image lightbox -->
  <script defer src="{{ '/assets/lib/clipboard/clipboard.min.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/lib/glightbox/glightbox.min.js' | relative_url }}"></script>
{% endif %}

{% if page.math %}
  <!-- MathJax -->
  <script src="{{ '/assets/js/data/mathjax.js' | relative_url }}"></script>
  <script async src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="{{ '/assets/lib/mathjax/tex-chtml.js' | relative_url }}"></script>
{% endif %}

<!-- Custom UI behaviour -->
<script defer src="{{ '/assets/js/blog.js' | relative_url }}"></script>
