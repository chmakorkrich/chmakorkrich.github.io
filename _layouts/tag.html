---
layout: page
# The layout for a single Tag page.
---

{% include lang.html %}

<div id="page-tag">
  <ul class="term-list">
    {% for post in page.posts %}
      <li>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        <span class="t-date">{{ post.date | date: '%Y-%m-%d' }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
